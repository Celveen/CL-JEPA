# Stall-triggered escapes on top of AdaJEPA (planning/escape.py; planner side, kept apart from
# the continual line). Same planner, adaptation and sub-planner settings as cont_plan_gd_pushobj.yaml,
# so runs pair episode by episode with its w=0 (AdaJEPA) chunks. Runs go through
# scripts/escape_run.py, which sets hydra.run.dir per arm and chunk.
defaults:
  - _self_
  - override hydra/launcher: submitit_slurm

hydra:
  run:
    dir: eval_outputs/escape/${planner.escape.mode}_seed${seed}
  sweep:
    dir: eval_outputs/escape/${planner.escape.mode}_seed${seed}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    nodes: 1
    tasks_per_node: 1
    cpus_per_task: 16
    mem_gb: 64
    gres: "gpu:1"
    qos: "normal"
    timeout_min: 720

ckpt_base_path: ./checkpoints # model dir (contains hydra.yaml + checkpoints/)
model_name: null
model_epoch: latest

seed: 100
n_evals: 20
segments_order: file      # run the chunk's targets in stored order (random: plan.py's usual draw)
goal_source: 'segments'
eval_data_path: null          # data/pushobj_eval/val_<shape>/plan_targets.pkl
ood_corruption: null
ood_level: null
env_kwargs_override: null
goal_H: 25
n_plot_samples: 10
decode_for_viz: false         # no per-replan videos; the diagnostics are in per_iter_logs.json
num_start_frames: 1

debug_dset_init: False

objective:
  _target_: planning.objectives.create_objective_fn
  alpha: 1
  base: 2
  mode: staged

planner:
  _target_: planning.escape.EscapeMPCPlanner
  max_iter: 30
  n_taken_actions: 5

  adapt:                           # the AdaJEPA step every adapting mode starts from
    lr: 5e-4
    steps: 1
    optimizer: adam
    finetune_every: 1
    replay_buffer: recent5
    finetune_encoder: true
    encoder_lr: 1e-5
    last_layer_only: true
    encoder_last_layer_only: true

  probe:
    seed: 0                        # mode is fixed to grad: the within-episode update is AdaJEPA
  escape:
    mode: none                     # none | kick_random | kick_goal | restart | staged
    start: 10                      # first replan (0-based) that may escape
    window: 3                      # stall: pusher moved < stall_px over the last `window` replans
    stall_px: 10.0
    max_n: 5                       # escapes per episode
    gap: null                      # min replans between escapes (null: window + 1)
    kick_px: 10.0                  # kick_*: pixel offset per env step on the escape replan
    restarts: 8                    # restart: initialisations planned in one batch (warm start + random)
    proprio_boost: 1.0             # kick_goal/staged: after the (pusher-phase) escape the objective's proprio term counts this x (1 = off)
    object_scale: 0.0              # staged: proprio weight in the object phase
    object_escapes: 1              # staged: escapes that start/extend the object phase (later ones are K2P)
    boost_replans: 0               # >0: the proprio boost covers the kick replan + this many after it (0: rest of episode)
    workspace_clip: false          # clip executed env steps whose target (pusher + offset) leaves [ws_lo, ws_hi]
    ws_lo: 22.0                    # pusher centre bounds: walls at 5/506 (radius 2) + pusher radius 15
    ws_hi: 489.0
    action_cap_px: 0.0             # >0: bound every env step's target offset (px); GD projects after each step
    seed: 0
  reuse_actions: true

  sub_planner:
    target: planning.gd.GDPlanner
    lr: 0.1
    sample_type: zero
    action_noise: 0
    horizon: 25
    var_scale: 1
    opt_steps: 100
    eval_every: -1
  name: escape_plan_gd_pushobj
