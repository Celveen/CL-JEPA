hydra:
  run:
    dir: /data/zjc/adaJEPA/CL-JEPA-cudagraph/eval_outputs/cmp_gd_official/w0/chunk_05_plus
  sweep:
    dir: eval_outputs/cont/w${planner.continual.w}_seed${seed}
    subdir: ${hydra.job.num}
  launcher:
    submitit_folder: ${hydra.sweep.dir}/.submitit/%j
    timeout_min: 720
    cpus_per_task: 16
    gpus_per_node: null
    tasks_per_node: 1
    mem_gb: 64
    nodes: 1
    name: ${hydra.job.name}
    stderr_to_stdout: false
    _target_: hydra_plugins.hydra_submitit_launcher.submitit_launcher.SlurmLauncher
    partition: null
    qos: normal
    comment: null
    constraint: null
    exclude: null
    gres: gpu:1
    cpus_per_gpu: null
    gpus_per_task: null
    mem_per_gpu: null
    mem_per_cpu: null
    account: null
    signal_delay_s: 120
    max_num_timeout: 0
    additional_parameters: {}
    array_parallelism: 256
    setup: null
  sweeper:
    _target_: hydra._internal.core_plugins.basic_sweeper.BasicSweeper
    max_batch_size: null
    params: null
  help:
    app_name: ${hydra.job.name}
    header: '${hydra.help.app_name} is powered by Hydra.

      '
    footer: 'Powered by Hydra (https://hydra.cc)

      Use --hydra-help to view Hydra specific help

      '
    template: '${hydra.help.header}

      == Configuration groups ==

      Compose your configuration from those groups (group=option)


      $APP_CONFIG_GROUPS


      == Config ==

      Override anything in the config (foo.bar=value)


      $CONFIG


      ${hydra.help.footer}

      '
  hydra_help:
    template: 'Hydra (${hydra.runtime.version})

      See https://hydra.cc for more info.


      == Flags ==

      $FLAGS_HELP


      == Configuration groups ==

      Compose your configuration from those groups (For example, append hydra/job_logging=disabled
      to command line)


      $HYDRA_CONFIG_GROUPS


      Use ''--cfg hydra'' to Show the Hydra config.

      '
    hydra_help: ???
  hydra_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][HYDRA] %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
    root:
      level: INFO
      handlers:
      - console
    loggers:
      logging_example:
        level: DEBUG
    disable_existing_loggers: false
  job_logging:
    version: 1
    formatters:
      simple:
        format: '[%(asctime)s][%(name)s][%(levelname)s] - %(message)s'
    handlers:
      console:
        class: logging.StreamHandler
        formatter: simple
        stream: ext://sys.stdout
      file:
        class: logging.FileHandler
        formatter: simple
        filename: ${hydra.runtime.output_dir}/${hydra.job.name}.log
    root:
      level: INFO
      handlers:
      - console
      - file
    disable_existing_loggers: false
  env: {}
  mode: RUN
  searchpath: []
  callbacks: {}
  output_subdir: .hydra
  overrides:
    hydra:
    - hydra.run.dir=/data/zjc/adaJEPA/CL-JEPA-cudagraph/eval_outputs/cmp_gd_official/w0/chunk_05_plus
    - hydra.mode=RUN
    task:
    - ckpt_base_path=/data/zjc/adaJEPA/CL-JEPA/checkpoints/pushobj_shape_shift
    - model_epoch=latest
    - eval_data_path=/data/zjc/adaJEPA/CL-JEPA-cudagraph/data/cont_streams/H7t3/chunk_05_plus.pkl
    - n_evals=50
    - +wandb_logging=false
    - planner.continual.w=0
    - planner.continual.tag=plus
    - planner.continual.state_in=null
    - planner.continual.save_deltas=false
    - planner.sub_planner.cuda_graph=true
    - seed=2000
  job:
    name: plan
    chdir: null
    override_dirname: +wandb_logging=false,ckpt_base_path=/data/zjc/adaJEPA/CL-JEPA/checkpoints/pushobj_shape_shift,eval_data_path=/data/zjc/adaJEPA/CL-JEPA-cudagraph/data/cont_streams/H7t3/chunk_05_plus.pkl,model_epoch=latest,n_evals=50,planner.continual.save_deltas=false,planner.continual.state_in=null,planner.continual.tag=plus,planner.continual.w=0,planner.sub_planner.cuda_graph=true,seed=2000
    id: ???
    num: ???
    config_name: cont_plan_gd_pushobj
    env_set: {}
    env_copy: []
    config:
      override_dirname:
        kv_sep: '='
        item_sep: ','
        exclude_keys: []
  runtime:
    version: 1.2.0
    version_base: '1.1'
    cwd: /data/zjc/adaJEPA/CL-JEPA-cudagraph
    config_sources:
    - path: hydra.conf
      schema: pkg
      provider: hydra
    - path: /data/zjc/adaJEPA/CL-JEPA-cudagraph/conf
      schema: file
      provider: main
    - path: ''
      schema: structured
      provider: schema
    output_dir: /data/zjc/adaJEPA/CL-JEPA-cudagraph/eval_outputs/cmp_gd_official/w0/chunk_05_plus
    choices:
      hydra/env: default
      hydra/callbacks: null
      hydra/job_logging: default
      hydra/hydra_logging: default
      hydra/hydra_help: default
      hydra/help: default
      hydra/sweeper: basic
      hydra/launcher: submitit_slurm
      hydra/output: default
  verbose: false
