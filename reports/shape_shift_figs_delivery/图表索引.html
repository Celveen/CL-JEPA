/- 1 sample SD across the three blocks, not a confidence interval. Seen shapes T, L, Z, + are in our base model&#x27;s training data; I, square, small T are not. Planning budget: at most 30 MPC replans; GD 100 steps, CEM 200 samples, top 30, 10 steps. Differences combine checkpoint and adaptation effects.</figcaption></details></figure><figure><h2>05. Ours over five continual-learning rounds - shape shifts</h2><a href="PDF_矢量/05_ours_five_rounds.pdf"><img loading="lazy" src="预览/05_ours_five_rounds.png"></a><details><summary>English caption</summary><figcaption>Success of Ours on its training streams over five continual-learning rounds. Each chain runs the seven shapes in the order I, L, square, Z, small T, +, T, 50 episodes each per round, with new test seeds every round, and keeps learning throughout; 350 episodes per chain per round. Lines show the mean over three chains (streams S7t3, S7t3s400, S7t3s700); shading denotes +/- 1 sample SD across chains. Rounds use different targets, so round differences include target, seed and adaptation-history effects. These are training-stream episodes, not the held-out H7t3 targets of the other figures. All panels use a 40-100% y-axis.</figcaption></details></figure><figure><h2>06. Planning trajectory and prediction loss - I / GD</h2><a href="PDF_矢量/06_gd_I_prediction_loss.pdf"><img loading="lazy" src="预览/06_gd_I_prediction_loss.png"></a><details><summary>English caption</summary><figcaption>Planning trajectory and latent prediction loss for the I shape with GD. Sample index 0 of test seed 2000 is fixed for every shape and planner, without outcome-based selection. Frozen and AdaJEPA use the official shape-shift checkpoint; Ours uses the round-5 state of chain 1 (stream S7t3), read-only. AdaJEPA and Ours rows show the frames saved during the run; the Frozen row replays the run&#x27;s executed actions in the simulator (replaying AdaJEPA&#x27;s actions reproduces its saved frames pixel for pixel, and the Frozen replay reproduces the run&#x27;s success step). Steps 0-13 and 30 are shown; gray frames repeat a terminated trajectory. The rightmost column is the goal, with the outcome. The lower panel is the online-adaptation buffer loss evaluated before each update: sliding-window one-step latent MSE on visual and proprioceptive tokens of up to five recent transitions, action dimensions excluded. AdaJEPA and Ours values are the logged losses (adajepa_losses.csv, identical to per_iter_logs.json). Frozen never adapts, so its loss is computed afterwards with the official checkpoint on its replayed trajectory, with the same buffer, preprocessing and loss function, in the training mode of the logged loss (dropout draws from fixed diagnostic seeds); the same code reproduces AdaJEPA&#x27;s logged theta0 buffer loss. Checkpoints and latent spaces differ between Ours and the baselines, so raw cross-method loss magnitude alone does not establish better predictions.</figcaption></details></figure><figure><h2>07. Planning trajectory and prediction loss - L / GD</h2><a href="PDF_矢量/07_gd_L_prediction_loss.pdf"><img loading="lazy" src="预览/07_gd_L_prediction_loss.png"></a><details><summary>English caption</summary><figcaption>Planning trajectory and latent prediction loss for the L shape with GD. Sample index 0 of test seed 2000 is fixed for every shape and planner, without outcome-based selection. Frozen and AdaJEPA use the official shape-shift checkpoint; Ours uses the round-5 state of chain 1 (stream S7t3), read-only. AdaJEPA and Ours rows show the frames saved during the run; the Frozen row replays the run&#x27;s executed actions in the simulator (replaying AdaJEPA&#x27;s actions reproduces its saved frames pixel for pixel, and the Frozen replay reproduces the run&#x27;s success step). Steps 0-13 and 30 are shown; gray frames repeat a terminated trajectory. The rightmost column is the goal, with the outcome. The lower panel is the online-adaptation buffer loss evaluated before each update: sliding-window
